name: Deploy GitHub Pages

# web/ を直して main に入れたら、https://takumi-saka.github.io/sunglasses/ に出す。
# アプリはこのページを開くだけなので、スマホのアプリは開き直せば新しい版になる。

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Version
        # 版の番号（コミットの頭 8 文字）とファイルの一覧を、ページと「端末に覚えておく係」に書き込む
        run: |
          cd web
          V=${GITHUB_SHA::8}
          FILES=$( (echo "./"; find . -type f ! -name sw.js | sed 's|^\./||' | sort) | jq -R . | jq -s -c .)
          sed -i "s|__VERSION__|$V|g" sw.js index.html
          sed -i "s|__FILES__|$FILES|" sw.js
      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
