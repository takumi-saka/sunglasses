<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<meta name="sg-version" content="__VERSION__">
<title>サングラス</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<section id="library" class="screen lib">
  <header class="lib-top">
    <div class="brand"><span class="brand-ja">サングラス</span><span class="brand-en">SUNGLASSES</span></div>
    <span id="lib-count" class="lib-count"></span>
    <button id="lib-open" class="pill">ファイルから開く</button>
  </header>
  <div id="lib-banner"></div>
  <div id="lib-list" class="lib-list"></div>
</section>

<section id="editor" class="screen ed" hidden>
  <header class="ed-top">
    <button id="ed-back" class="icon-btn" aria-label="一覧へ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ed-title"><span id="ed-name"></span><span id="ed-sub"></span></div>
    <button id="ed-undo" class="icon-btn" aria-label="1つ戻す"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="ed-redo" class="icon-btn" aria-label="やり直す"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button id="ed-more" class="icon-btn" aria-label="ほかの操作"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    <button id="ed-export" class="pill accent">書き出す</button>
  </header>
  <div id="ed-photo" class="ed-photo">
    <canvas id="photo-canvas"></canvas>
    <img id="ed-preview" alt="" hidden>
    <div id="ed-grid" class="ed-grid"></div>
    <div id="ed-badge" class="ed-badge" hidden></div>
  </div>
  <div class="ed-info">
    <button id="ed-core-chip" class="core-chip"></button>
    <span id="ed-hint" class="ed-hint"></span>
    <button id="ed-one" class="mini-btn">等倍</button>
    <canvas id="ed-hist" class="hist" aria-label="明るさの山。押している間は白飛びと黒つぶれを色で出す"></canvas>
  </div>
  <nav id="ed-tabs" class="tabs"></nav>
  <div id="ed-panel" class="ed-panel"></div>
</section>
<script type="module" src="app/main.js"></script>
</body>
</html>
