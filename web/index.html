<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="sg-version" content="__VERSION__">
<title>サングラス</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<section id="library" class="screen lib">
  <header class="lib-top">
    <div id="lib-brand" class="lib-brand"><b>Sunglasses</b><span id="lib-count" class="lib-count num"></span></div>
    <button id="lib-open" class="icon-btn" aria-label="写真を読み込む"><svg viewBox="0 0 24 24"><path d="M12 4v10m-4-4 4 4 4-4M5 15v4h14v-4"/></svg></button>
    <button id="lib-sel-start" class="lib-word">選択</button>
  </header>
  <div id="lib-banner"></div>
  <div id="lib-list" class="lib-list"></div>
  <div class="lib-shoot"><button id="lib-camera" class="shoot-btn" aria-label="撮影"><span id="lib-camera-core" class="shoot-core"></span></button></div>
  <div id="lib-select" class="lib-select" hidden>
    <span id="lib-sel-count" class="lib-sel-count num"></span>
    <button id="lib-sel-cancel" class="lib-sel-btn">キャンセル</button>
    <button id="lib-sel-all" class="lib-sel-btn">すべて選択</button>
    <button id="lib-sel-delete" class="lib-sel-btn is-danger">削除</button>
  </div>
</section>
<section id="editor" class="screen ed" hidden>
  <!-- 地: 開いている写真をぼかして暗くしたもの -->
  <div class="ed-bg"><div id="ed-bg"></div></div>
  <header class="ed-top">
    <button id="ed-back" class="icon-btn" aria-label="一覧へ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="ed-steps" class="ed-steps"><button id="ed-undo" class="icon-btn" aria-label="1つ戻す"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="ed-redo" class="icon-btn" aria-label="やり直す"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button></div>
    <button id="ed-export" class="ed-export">書き出し</button>
  </header>
  <div id="ed-photo" class="ed-photo">
    <canvas id="photo-canvas"></canvas>
    <img id="ed-preview" alt="" hidden>
    <div id="ed-grid" class="ed-grid"></div>
  </div>
  <div class="ed-under">
    <div class="ed-meta">
      <span id="ed-badge" class="ed-badge" hidden></span>
      <button id="ed-core-chip" class="ed-look" aria-label="ルック"></button>
      <button id="ed-one" class="ed-one num" aria-label="等倍と全体の切り替え">100%</button>
      <button id="ed-cmp" class="icon-btn ed-cmp" aria-label="押している間は補正前"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M12 3v18"/></svg></button>
    </div>
    <div id="ed-panel" class="ed-panel"></div>
    <nav id="ed-tabs" class="tabs"></nav>
  </div>
</section>
<section id="camera" class="screen cam" hidden>
  <!-- 地: カメラの小さな画をぼかして暗くしたもの。写真の所だけ、角の丸い窓を開ける（カメラの画は APK がページの下に描く） -->
  <div id="cam-amb" class="cam-amb" aria-hidden="true"><canvas id="cam-amb-cv"></canvas></div>
  <header class="cam-top">
    <button id="cam-back" class="icon-btn rot" aria-label="一覧へ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="cam-core" class="cam-title" aria-label="ルック（たたくと一覧、長押しで補正前）"><b></b><small></small></button>
    <div class="cam-quick">
      <button id="cam-set-flash" class="icon-btn cam-q rot" aria-label="フラッシュ"><svg viewBox="0 0 24 24"><path d="M13 3L5.5 13.5H11L10 21l7.5-10.5H12z"/></svg></button>
      <button id="cam-set-timer" class="icon-btn cam-q rot" aria-label="タイマー"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V9.5M9.5 3.5h5"/></svg><b class="num"></b></button>
    </div>
  </header>
  <!-- 写真の上には、字も印も置かない（本人 11/26）。置くのは、枠の目安の線・水平の線・ピントを合わせた所の輪だけ -->
  <div id="cam-view" class="cam-view">
    <div id="cam-frame" class="cam-frame"></div>
    <div id="cam-grid" class="cam-grid" hidden></div>
    <div id="cam-level" class="cam-level"></div>
    <div id="cam-ring" class="cam-ring"></div>
    <div id="cam-msg" class="cam-msg" hidden></div>
  </div>
  <div id="cam-under" class="cam-under">
    <div class="cam-info">
      <div class="cam-meta"><span id="cam-readout" class="cam-readout"></span><span id="cam-count" class="cam-count"></span><span id="cam-badge" class="cam-badge" hidden></span></div>
      <div id="cam-lenses" class="cam-lenses"></div>
      <div class="cam-histbox"><canvas id="cam-hist" class="hist"></canvas></div>
    </div>
    <div class="cam-deck"><div id="cam-pro" class="cam-pro"></div><div id="cam-ev" class="cam-ev"></div><div id="cam-fixed" class="cam-fixed" hidden><b class="num">F10　1/140　ISO 400</b><span id="cam-fixed-note"></span></div></div>
    <div class="cam-bottom">
      <button id="cam-thumb" class="cam-thumb rot" aria-label="撮った写真を開く"></button>
      <button id="cam-shutter" class="cam-shutter" aria-label="撮影"><span id="cam-shutter-core" class="cam-shutter-core num"></span></button>
      <button id="cam-gear" class="cam-gear rot" aria-label="設定"><svg viewBox="0 0 24 24"><path d="M4 8h9M19 8h1M4 16h1M11 16h9"/><circle cx="16" cy="8" r="2.5"/><circle cx="8" cy="16" r="2.5"/></svg></button>
    </div>
    <!-- ルックの一覧と設定は、写真の下の数字の所に出す -->
    <div id="cam-looks" class="cam-panel cam-looks" hidden></div>
    <div id="cam-sets" class="cam-panel cam-sets" hidden></div>
  </div>
</section>
<script type="module" src="app/main.js"></script>
</body>
</html>
