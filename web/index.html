<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="sg-version" content="__VERSION__">
<title>サングラス</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<section id="library" class="screen lib">
  <header class="lib-top">
    <div class="brand"><span class="brand-ja">サングラス</span><span class="brand-en">SUNGLASSES</span></div>
    <span id="lib-count" class="lib-count"></span>
    <button id="lib-open" class="lib-import"><svg viewBox="0 0 24 24"><path d="M12 4v10m-4-4 4 4 4-4M5 15v4h14v-4"/></svg><span>読み込み</span></button>
  </header>
  <div id="lib-banner"></div>
  <div id="lib-list" class="lib-list"></div>
  <div class="lib-shoot"><button id="lib-camera" class="shoot-btn"><span class="knurl"></span><span>撮影</span></button></div>
  <div id="lib-select" class="lib-select" hidden>
    <button id="lib-sel-cancel" class="lib-sel-btn">やめる</button>
    <span id="lib-sel-count" class="lib-sel-count"></span>
    <button id="lib-sel-all" class="lib-sel-btn">すべて</button>
    <button id="lib-sel-delete" class="lib-sel-btn is-danger">削除</button>
  </div>
</section>

<section id="editor" class="screen ed" hidden>
  <header class="ed-top">
    <button id="ed-back" class="icon-btn" aria-label="一覧へ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ed-title"><span id="ed-name"></span><span id="ed-sub"></span></div>
    <button id="ed-undo" class="icon-btn" aria-label="1つ戻す"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="ed-redo" class="icon-btn" aria-label="やり直す"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button id="ed-more" class="icon-btn" aria-label="ほかの操作"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    <button id="ed-export" class="ed-export">書き出し</button>
  </header>
  <div id="ed-photo" class="ed-photo">
    <canvas id="photo-canvas"></canvas>
    <img id="ed-preview" alt="" hidden>
    <div id="ed-grid" class="ed-grid"></div>
    <div id="ed-badge" class="ed-badge" hidden></div>
  </div>
  <div class="ed-info">
    <button id="ed-core-chip" class="core-chip"></button>
    <span id="ed-hint" class="ed-hint"></span>
    <button id="ed-one" class="mini-btn">等倍</button>
    <canvas id="ed-hist" class="hist" aria-label="明るさの山。押している間は白飛びと黒つぶれを色で出す"></canvas>
  </div>
  <nav id="ed-tabs" class="tabs"></nav>
  <div id="ed-panel" class="ed-panel"></div>
</section>
<section id="camera" class="screen cam" hidden>
  <header class="cam-top">
    <button id="cam-back" class="icon-btn rot" aria-label="一覧へ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="cam-sets">
      <button id="cam-set-frame" class="cam-set rot"><span>枠</span><b></b></button>
      <button id="cam-set-timer" class="cam-set rot"><span>タイマー</span><b></b></button>
      <button id="cam-set-zebra" class="cam-set rot"><span>ゼブラ</span><b></b></button>
      <button id="cam-set-sound" class="cam-set rot"><span>シャッター音</span><b></b></button>
      <button id="cam-set-jpeg" class="cam-set rot"><span>JPEG</span><b></b></button>
    </div>
  </header>
  <div id="cam-view" class="cam-view">
    <div id="cam-frame" class="cam-frame"></div>
    <div id="cam-grid" class="cam-grid" hidden></div>
    <div id="cam-level" class="cam-level"></div>
    <div id="cam-ring" class="cam-ring"></div>
    <div id="cam-badge" class="ed-badge" hidden></div>
    <div id="cam-bubble" class="cam-bubble" aria-hidden="true"><small></small><b></b></div>
    <div id="cam-msg" class="cam-msg" hidden></div>
  </div>
  <!-- 写真には何も重ねない（本人 11/6）。レンズの切り替えは残りの枚数の行に入れて、1行減らす -->
  <div class="cam-info"><span id="cam-readout" class="cam-readout"></span><div id="cam-lenses" class="cam-lenses"></div><span id="cam-count" class="cam-count"></span><canvas id="cam-hist" class="hist"></canvas></div>
  <div id="cam-pro" class="cam-pro"></div>
  <div id="cam-ev" class="cam-ev"></div>
  <div class="cam-bottom">
    <button id="cam-thumb" class="cam-thumb rot" aria-label="撮った写真を開く"></button>
    <button id="cam-shutter" class="cam-shutter" aria-label="撮影"></button>
    <button id="cam-core" class="cam-core rot" aria-label="ルック（たたくと切り替え、長押しで元の画）"></button>
  </div>
</section>
<script type="module" src="app/main.js"></script>
</body>
</html>
