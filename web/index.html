<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>サングラス</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #e8e2d6; font: 15px/1.7 system-ui, sans-serif; padding: 24px 16px; }
  h1 { font-size: 18px; letter-spacing: .2em; font-weight: 600; margin: 0 0 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { border-bottom: 1px solid #222; padding: 6px 4px; vertical-align: top; word-break: break-all; }
  td:first-child { color: #9a948a; width: 44%; word-break: normal; }
  button { background: #1a1a1a; color: #e8e2d6; border: 1px solid #444; border-radius: 6px; padding: 10px 14px; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<h1>サングラス</h1>
<p>準備中です。この画面は、スマホで画の処理が動くかを確かめるためのものです。</p>
<table id="t"></table>
<button id="perm" hidden>写真へのアクセスを許可する</button>
<script>
  const rows = [];
  const add = (k, v) => rows.push([k, String(v)]);
  const B = window.SunglassesBridge;
  add("アプリの窓口", B ? JSON.parse(B.appInfo()).bridge + "（" + JSON.parse(B.appInfo()).model + "）" : "なし（ブラウザで開いている）");
  const gl = document.createElement("canvas").getContext("webgl2");
  add("WebGL2", gl ? "使える" : "使えない");
  if (gl) {
    add("画の最大の大きさ", gl.getParameter(gl.MAX_TEXTURE_SIZE));
    add("3D の色の表の最大", gl.getParameter(gl.MAX_3D_TEXTURE_SIZE));
    for (const e of ["EXT_color_buffer_float", "EXT_color_buffer_half_float", "OES_texture_float_linear"]) add(e, gl.getExtension(e) ? "あり" : "なし");
  }
  add("WebAssembly", typeof WebAssembly === "object" ? "使える" : "使えない");
  add("端末のメモリ（目安）", (navigator.deviceMemory || "?") + " GB");
  function render() {
    if (B) {
      const p = B.mediaPermission();
      add("写真へのアクセス", p);
      if (p !== "none") add("RAW（DNG）の枚数", JSON.parse(B.listRaw()).length);
      document.getElementById("perm").hidden = p === "full";
    }
    document.getElementById("t").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v.replace(/</g, "&lt;")}</td></tr>`).join("");
  }
  render();
  document.getElementById("perm").onclick = () => B && B.requestMediaPermission();
  window.addEventListener("sunglasses:permission", () => location.reload());
</script>
</body>
</html>
