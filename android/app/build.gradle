plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.takumi.sunglasses'
    compileSdk 35
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'jp.takumi.sunglasses'
        // ページの住所。スマホに入れる版は GitHub のページ
        buildConfigField 'String', 'START_URL', '"https://takumi-saka.github.io/sunglasses/"'
        buildConfigField 'String', 'HOST', '"takumi-saka.github.io"'
        buildConfigField 'String', 'LOCAL_PREFIX', '"/sunglasses/__local/"'
        // 画面を APK の中から渡すか（試作の版だけ）
        buildConfigField 'boolean', 'BUNDLED', 'false'
        manifestPlaceholders = [cleartext: 'false', appLabel: 'サングラス']
        minSdk 29
        targetSdk 34
        // GitHub で作るたびに番号が上がるので、上から入れ直せる
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0'
    }

    // 署名の鍵は公開の置き場に入れず、GitHub の秘密の保管場所から渡す（同じ鍵で署名しないと上から入れ直せない）。
    // 鍵が無いとき（この Mac で試しに作るとき）は、開発用の鍵で署名する。
    signingConfigs {
        release {
            def ks = System.getenv('SG_KEYSTORE')
            storeFile ks ? file(ks) : null
            storePassword System.getenv('SG_KEYSTORE_PASSWORD')
            keyAlias 'sunglasses'
            keyPassword System.getenv('SG_KEYSTORE_PASSWORD')
            storeType 'pkcs12'
        }
    }

    buildTypes {
        // 確かめ用（この Mac の仮想スマホ）: この Mac の配信（仮想スマホから見た Mac は 10.0.2.2）を開く
        debug {
            buildConfigField 'String', 'START_URL', '"http://10.0.2.2:8765/"'
            buildConfigField 'String', 'HOST', '"10.0.2.2"'
            buildConfigField 'String', 'LOCAL_PREFIX', '"/__local/"'
            manifestPlaceholders = [cleartext: 'true']
        }
        // 試作（公開せずに実機で試す）: 画面を APK の中に入れ、別のアプリとして入れる（公開中の版と並べて置ける）。
        // 住所は実在しない宛先で、アプリが APK の中のファイルを返す。署名は開発用の鍵
        next {
            initWith release
            applicationIdSuffix '.next'
            versionNameSuffix '-next'
            signingConfig signingConfigs.debug
            buildConfigField 'String', 'START_URL', '"https://next.sunglasses.invalid/"'
            buildConfigField 'String', 'HOST', '"next.sunglasses.invalid"'
            buildConfigField 'String', 'LOCAL_PREFIX', '"/__local/"'
            buildConfigField 'boolean', 'BUNDLED', 'true'
            manifestPlaceholders = [appLabel: 'サングラス 試作']
        }
        release {
            minifyEnabled false
            signingConfig System.getenv('SG_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 試作の版に入れる画面のファイル（web/ を build/webAssets/web へ写してから APK に入れる）
def webAssets = layout.buildDirectory.dir('webAssets').get().asFile
tasks.register('copyWebAssets', Copy) {
    from '../../web'
    into new File(webAssets, 'web')
}
android.sourceSets.next.assets.srcDir webAssets
tasks.configureEach { t -> if (t.name != 'copyWebAssets' && t.name.contains('Next')) t.dependsOn('copyWebAssets') }
