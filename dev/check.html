<!doctype html>
<meta charset="utf-8">
<title>画の処理の確かめ</title>
<canvas id="c" width="800" height="600"></canvas>
<script type="module">
  // 確かめ用: RAW を開き、決まった幅で、核ごと・段ごとに描いた画（PNG）と、露光量の値を返す
  import { Engine, defaultParams } from "/engine/engine.js";
  import { shotInfo } from "/engine/exif.js";
  import { sceneOf } from "/engine/color.js";
  window.__run = async (dngUrl, width, modes) => {
    const e = window.__e || (window.__e = await Engine.create(document.getElementById("c")));
    const res = await fetch(dngUrl);
    const t0 = performance.now();
    // JPEG・PNG（ほかのアプリの写真）は、アプリと同じく画像として開く。それ以外は RAW
    const buf = await res.arrayBuffer();
    const im = /\.(jpe?g|png)$/i.test(dngUrl) ? await e.openBitmap(await createImageBitmap(new Blob([buf])), shotInfo(buf)) : await e.openRaw(buf);
    const out = { meta: im.meta, scene: (sceneOf(im.meta, im.key) || {}).ev ?? null, key: im.key, w: im.w, h: im.h, decodeMs: performance.now() - t0, results: [] };
    for (const m of modes) {
      const p = defaultParams();
      p.core = m.core;
      if (m.kind === "lut") Object.assign(p, { soften: -100, halation: -100, bloom: -100, grain: -100 });
      if (m.kind === "nograin") p.grain = -100;
      Object.assign(p, m.params || {});
      // 確かめ用: 光の色を残す決まり（keepLight）を、描き方ごとに差し替える（null で残さない）。露光の覚えも捨てる
      // 確かめ用: 露光の決まり（meter）の値を、描き方ごとに上書きする（night: null で夜の決まりを外す、など）
      if (m.meter) {
        for (const id of [m.core, e.coreById(m.core).sunInto]) if (id) Object.assign(e.coreById(id).meter, m.meter);
        e.evCache = {};
      }
      if ("keepLight" in m) {
        for (const id of [m.core, e.coreById(m.core).sunInto]) if (id) e.coreById(id).keepLight = m.keepLight;
        e.evCache = {};
      }
      e.params = p;
      const t1 = performance.now();
      const r = e.renderPixels(width, { compare: m.kind === "neutral" });
      const ms = performance.now() - t1;
      const cv = document.createElement("canvas");
      cv.width = r.width;
      cv.height = r.height;
      cv.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(r.pixels.buffer), r.width, r.height), 0, 0);
      out.results.push({ ...m, ev: e.autoEv(m.core), evNeutral: e.autoEv("neutral"), ms, png: cv.toDataURL("image/png") });
    }
    return out;
  };
  window.__ready = true;
</script>
